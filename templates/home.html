<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Fit</title>
    <!-- Global Style -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Local Style -->
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='css/style.css')}}">

<body>
    <h1>Raw Muscle Gym Tracker</h1>
    <div class="container">
        <div class="row">
            <div class="col-4">
            </div>            
            <div class="col-2" id = "select">
                <select class="form-select float-start" aria-label="Lift Select" id = "select1">
                    <option selected>Select Lift</option>
                    <option value="1">Squat</option>
                    <option value="2">Bench</option>
                    <option value="3">Deadlift</option>
                  </select>
            </div>                
            <div class="col">               
            </div>
        </div>
        <div class="row">
            <div class="col">
            </div>
            <div class="col-4">
                <button type="button" class="btn btn-dark btn-sm float-end" onclick="window.location.href= '/display' ;" id="submit_button">Submit</button>            
            </div>
            <div class="col">
            </div>
        </div>
    </div>

    
    
    <!-- Global Libs  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.5/axios.min.js" integrity="sha512-01Pe9P3mJM/4c80VuoYEGHlspKGbd9uWQe9HtdLsdTqV0CS1kz8ca44sinVEXEvlZNciMmsAjeEbm5ZxHC7yYg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>  
    <!-- Local Libs -->
    <script type="text/javascript" src="{{url_for('static',filename='js/scripts.js')}}"></script>
</body>
</html>
